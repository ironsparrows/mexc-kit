version: 1
builder:
  configs:
    - documentation_targets: [MexcKit]
    # Build the library, not the package scheme, which also holds the test targets.
    - platform: ios
      scheme: MexcKit
    - platform: macos-xcodebuild
      scheme: MexcKit
    - platform: tvos
      scheme: MexcKit
    - platform: visionos
      scheme: MexcKit
